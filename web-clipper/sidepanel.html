<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MediaVault Web Clipper</title><link rel="stylesheet" href="sidepanel.css"></head><body><header><div class="brand"><img src="icons/icon32.png"><div><b>MediaVault</b><span>Web Clipper</span></div></div><button id="refresh" title="Refresh">↻</button></header><main><section id="dropArea" class="drop-area"><div class="drop-icon">↓</div><strong>Drop a web image here</strong><small>Drag an image from a webpage into this panel.</small></section><section id="clipCard" class="clip-card hidden"><div class="preview"><img id="preview" alt="Selected web image"></div><div class="clip-name" id="clipName"></div><div class="source" id="sourceText"></div></section><section class="form"><label>Folder<select id="folder"><option value="">Library root</option></select></label><label>Collection<select id="collection"><option value="">No collection</option></select></label><label>Tags<input id="tags" placeholder="wallpaper, reference, football"></label><label>Notes<textarea id="notes" rows="3" placeholder="Optional note…"></textarea></label><label class="check"><input id="inbox" type="checkbox"> Also send to Inbox</label><label class="check"><input id="keepSource" type="checkbox" checked> Save source URL</label></section><div id="status" class="status"></div><button id="save" class="save" disabled>Save to MediaVault</button><button id="test" class="link-btn">Test MediaVault connection</button></main><script src="sidepanel.js"></script></body></html>
